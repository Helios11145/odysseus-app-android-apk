
name: Build Odysseus Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "companion/mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install app dependencies
        working-directory: companion/mobile
        run: npm install

      - name: Build web app
        working-directory: companion/mobile
        run: npm run build

      - name: Generate Android project
        working-directory: companion/mobile
        run: npx cap add android

      - name: Sync Android project
        working-directory: companion/mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: companion/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: odysseus-debug-apk
          path: companion/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
